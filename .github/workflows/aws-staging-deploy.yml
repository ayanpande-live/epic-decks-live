name: AWS Staging Deploy (Full Epic Decks Site)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: epic-decks-aws-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ayanpande-live/epic-decks-live' && github.ref == 'refs/heads/feature/my-epic-decks-learning-pwa-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare allowlisted static site files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, shutil, html

          output = Path('/tmp/epic-decks-staging-publish')
          output.mkdir(parents=True, exist_ok=True)
          allowed = {'.html', '.css', '.js', '.mjs', '.webmanifest',
                     '.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp',
                     '.avif', '.ico', '.woff', '.woff2', '.ttf',
                     '.txt', '.xml', '.pdf', '.mp4', '.webm'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          count = 0
          for name in tracked:
              if not name:
                  continue
              source = Path(name)
              parts = source.parts
              if any(part.startswith('.') for part in parts):
                  continue
              if any(part in {'node_modules', 'tests', '__tests__', 'scripts', 'docs'} for part in parts):
                  continue
              if source.suffix.lower() not in allowed:
                  continue
              if source.name.endswith(('.test.js', '.test.mjs', '.spec.js', '.spec.mjs')):
                  continue
              if not source.is_file():
                  continue
              dest = output / source
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, dest)
              count += 1

          # Reproduce the three legacy Vercel redirects as static landing pages.
          redirects = {
              'privacy-policy.html': '/legal/privacy-policy.html',
              'cookie-policy.html': '/legal/cookie-policy.html',
              'terms-and-conditions.html': '/legal/legal-notice.html',
          }
          for legacy, target in redirects.items():
              if not (output / target.lstrip('/')).is_file():
                  raise SystemExit(f'Missing redirect destination: {target}')
              safe_target = html.escape(target, quote=True)
              (output / legacy).write_text(
                  '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  f'<meta http-equiv="refresh" content="0;url={safe_target}">'
                  f'<link rel="canonical" href="{safe_target}">'
                  '</head><body>'
                  f'<p>This page moved to <a href="{safe_target}">{safe_target}</a>.</p>'
                  '</body></html>', encoding='utf-8')

          for required in ['index.html', 'labs/my-epic-decks/index.html']:
              if not (output / required).is_file():
                  raise SystemExit(f'Missing required site page: {required}')
          print(f'Prepared {count} tracked static assets plus redirect pages')
          PY

      - name: Configure temporary AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454492134257:role/EpicDecks-GitHub-Staging-Deploy
          aws-region: eu-west-3
          role-session-name: epic-decks-staging

      - name: Upload full static site to private staging S3 (non-destructive)
        run: |
          aws s3 sync /tmp/epic-decks-staging-publish/ s3://epic-decks-staging-euw3-2026/ --no-progress

      - name: Refresh CloudFront staging cache
        run: |
          aws cloudfront create-invalidation --distribution-id E38YMZ6TN5CHNQ --paths "/*"
